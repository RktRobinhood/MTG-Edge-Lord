name: Daily research build

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "EDHREC commander pages to crawl this run (default 300)"
        required: false
      commanders:
        description: "Archidekt commanders to query this run (default 200)"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

# Two runs must never race on the rotation cursors in state/connectors.json:
# both would start from the same commander and one would overwrite the other.
concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    # The rotated EDHREC crawl is ~300 pages at 600ms, and Archidekt is ~200
    # at 1,500ms under their stated 40 req/min. Together that is around
    # 10 minutes before anything else runs.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect, score and validate
        env:
          # A missing secret disables its lane and never fails the run. The
          # catalogue refresh is deterministic and is worth publishing on its
          # own, so an absent key must not cost it.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/run-research.js --network \
            ${{ inputs.pages && format('--pages={0}', inputs.pages) || '' }} \
            ${{ inputs.commanders && format('--commanders={0}', inputs.commanders) || '' }}
          npm run validate
          npm test
          npm run build

      # Rotation cursors and bulk-file timestamps have to survive the run, or
      # tomorrow starts from the same commander and re-downloads 24MB.
      - name: Classify the change
        id: change
        run: |
          if git diff --quiet -- data state mtg-edge-lord.user.js; then
            echo "kind=none" >> "$GITHUB_OUTPUT"
          elif git diff --quiet -- data/findings.json data/history; then
            echo "kind=catalogue" >> "$GITHUB_OUTPUT"
          else
            echo "kind=findings" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing changed
        if: steps.change.outputs.kind == 'none'
        run: echo "No meaningful data changes."

      # A catalogue refresh is deterministic: ranks, deck counts, bracket
      # distributions and scores derived from them. It may auto-commit.
      - name: Publish the catalogue refresh
        if: steps.change.outputs.kind == 'catalogue'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state mtg-edge-lord.user.js
          git commit -m "data: refresh commander catalogue and scores"
          git push

      # Findings come from a model and are non-deterministic, so they are
      # never pushed unreviewed. This is AGENTS.md's diff-review rule enforced
      # by the workflow rather than by anyone remembering it.
      - name: Open a review PR for feed changes
        id: review
        if: steps.change.outputs.kind == 'findings'
        # The branch is pushed before the PR is requested, so a refused PR
        # still leaves the finds safe on it. The next step makes that loud.
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/findings-${{ github.run_id }}
          commit-message: "data: new or changed discovery findings"
          title: "Review: new discovery findings (${{ github.run_id }})"
          add-paths: |
            data
            state
            mtg-edge-lord.user.js
          body: |
            Generated by the daily research build.

            **Findings changed, so this needs review before it reaches users.**
            The judgement stage uses a model and is non-deterministic: two runs
            can disagree, and a confidently-worded wrong answer looks exactly
            like a right one.

            Check each new or changed finding for:

            - [ ] The canonical source link resolves, and to the thing the summary describes
            - [ ] The summary is our own words, not the creator's prose
            - [ ] The commander named is actually the subject, not a passing mention
            - [ ] Dates and attribution are right
            - [ ] Scores look sane against the components shown

            Auto-merge is deliberately not enabled on this PR.

      # The 2026-09-23 build pushed its branch and then could not open the PR,
      # because the repository does not let Actions create pull requests. The
      # finds sat on a branch nobody knew about, and every installed script
      # kept showing the same list. An issue is allowed where a PR is not, so
      # a stranded branch always leaves a trail with a one-click PR link.
      - name: Flag a review branch that could not become a PR
        if: steps.change.outputs.kind == 'findings' && steps.review.outputs.pull-request-number == ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: data/findings-${{ github.run_id }}
        run: |
          {
            echo "The daily build found new or changed findings and pushed them to \`$BRANCH\`, but could not open the review PR."
            echo
            echo "Open it here: https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
            echo
            echo "Until it is merged, no installed script sees these finds. To stop this recurring, enable *Settings → Actions → General → Allow GitHub Actions to create and approve pull requests*."
          } > stranded.md
          gh issue create --title "Review: new discovery findings stranded on $BRANCH" --body-file stranded.md
