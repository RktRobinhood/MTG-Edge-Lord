name: Daily research build

on:
  schedule:
    # After the daily finds run (09:30 Copenhagen, 07:30 or 08:30 UTC by
    # season, and up to half an hour long), so whatever it filed to
    # research/inbox/ that morning publishes the same day, not the next.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "EDHREC commander pages to crawl this run (default 300)"
        required: false
      commanders:
        description: "Archidekt commanders to query this run (default 200)"
        required: false

permissions:
  contents: write

# Two runs must never race on the rotation cursors in state/connectors.json:
# both would start from the same commander and one would overwrite the other.
concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    # The rotated EDHREC crawl is ~300 pages at 600ms, and Archidekt is ~200
    # at 1,500ms under their stated 40 req/min. Together that is around
    # 10 minutes before anything else runs.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect, score and validate
        env:
          # A missing secret disables its lane and never fails the run. The
          # catalogue refresh is deterministic and is worth publishing on its
          # own, so an absent key must not cost it.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/run-research.js --network \
            ${{ inputs.pages && format('--pages={0}', inputs.pages) || '' }} \
            ${{ inputs.commanders && format('--commanders={0}', inputs.commanders) || '' }}
          npm run validate
          npm test
          npm run build

      # Rotation cursors and bulk-file timestamps have to survive the run, or
      # tomorrow starts from the same commander and re-downloads 24MB.
      #
      # Findings publish straight to main, the same as the catalogue. They
      # used to wait on a review PR, and on 2026-09-23 the repository refused
      # to let Actions open one: the finds sat on a branch nobody knew about
      # and every installed script kept showing the same list. The feed is a
      # daily trickle by choice now; each finding keeps its source link
      # prominent, and a bad one is fixed forward.
      - name: Publish
        run: |
          if git diff --quiet -- data state mtg-edge-lord.user.js; then
            echo "No meaningful data changes."
            exit 0
          fi
          if git diff --quiet -- data/findings.json data/history; then
            message="data: refresh commander catalogue and scores"
          else
            message="data: new or changed discovery findings"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state mtg-edge-lord.user.js
          git commit -m "$message"
          # The finds run may have pushed to research/ while this crawled.
          # It never touches data/ or state/, so the rebase is clean.
          git pull --rebase
          git push
