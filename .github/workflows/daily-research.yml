name: Daily research build

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect, normalize, and validate
        run: npm run research:network && npm run validate && npm test && npm run build
      - name: Commit meaningful data changes
        run: |
          if git diff --quiet -- data mtg-edge-lord.user.js; then
            echo "No meaningful data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data mtg-edge-lord.user.js
          git commit -m "data: refresh discovery findings"
          git push
