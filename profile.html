<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commander Profile - Commander Edgeboard</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/data.js" defer></script>
  <script src="assets/profile.js" defer></script>
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">CE</span>
      <div>
        <h1>Commander Profile</h1>
        <p>rated deck habits and preference signals</p>
      </div>
    </div>
    <div class="appbar-actions">
      <a class="button" href="index.html">Discovery</a>
      <a class="button active-link" href="profile.html">Profile</a>
      <button id="newProfileButton" class="button" type="button">New deck</button>
      <button id="exportProfileButton" class="button" type="button">Export</button>
      <label class="button file-button" for="importProfileFile">Import</label>
      <input id="importProfileFile" class="sr-only" type="file" accept="application/json,.json">
    </div>
  </header>

  <main class="profile-layout">
    <section class="profile-entry panel" aria-label="Commander deck entry">
      <div class="panel-head">
        <h2>Commander Entry</h2>
        <span id="profileStatus" class="mini-status" role="status">Ready.</span>
      </div>

      <div class="profile-form-grid">
        <label class="wide">
          <span>Commander</span>
          <input id="commanderNameInput" type="search" list="commanderOptions" placeholder="Commander name">
          <datalist id="commanderOptions"></datalist>
        </label>

        <fieldset>
          <legend>Color identity</legend>
          <div class="mana-filter" id="profileColorGroup">
            <label><input type="checkbox" value="W"><span>W</span></label>
            <label><input type="checkbox" value="U"><span>U</span></label>
            <label><input type="checkbox" value="B"><span>B</span></label>
            <label><input type="checkbox" value="R"><span>R</span></label>
            <label><input type="checkbox" value="G"><span>G</span></label>
            <label><input type="checkbox" value="C"><span>C</span></label>
          </div>
        </fieldset>

        <fieldset class="wide">
          <legend>Enjoyment</legend>
          <div id="ratingGroup" class="star-group" aria-label="Enjoyment rating">
            <button type="button" data-rating="1">1</button>
            <button type="button" data-rating="2">2</button>
            <button type="button" data-rating="3">3</button>
            <button type="button" data-rating="4">4</button>
            <button type="button" data-rating="5">5</button>
          </div>
        </fieldset>

        <label>
          <span>Power</span>
          <input id="powerInput" type="range" min="1" max="5" value="3">
        </label>
        <label>
          <span>Complexity</span>
          <input id="complexityInput" type="range" min="1" max="5" value="3">
        </label>
        <label>
          <span>Table heat</span>
          <input id="tableHeatInput" type="range" min="1" max="5" value="3">
        </label>

        <label>
          <span>Pattern</span>
          <select id="patternSelect">
            <option value="value">Value</option>
            <option value="combat">Combat</option>
            <option value="combo">Combo</option>
            <option value="control">Control</option>
            <option value="politics">Politics</option>
            <option value="toolbox">Toolbox</option>
            <option value="engine">Engine</option>
            <option value="typal">Typal</option>
          </select>
        </label>
        <label>
          <span>Speed</span>
          <select id="speedSelect">
            <option value="fast">Fast</option>
            <option value="mid" selected>Midgame</option>
            <option value="slow">Slow</option>
          </select>
        </label>
        <label>
          <span>Status</span>
          <select id="deckStatusSelect">
            <option value="active">Active</option>
            <option value="testing">Testing</option>
            <option value="retired">Retired</option>
            <option value="dismantled">Dismantled</option>
          </select>
        </label>

        <label class="wide">
          <span>Archetype tags</span>
          <input id="deckTagsInput" type="text" placeholder="Artifacts, Sacrifice, Politics">
        </label>
        <label class="wide">
          <span>What you like</span>
          <input id="likesInput" type="text" placeholder="Puzzle turns, toolbox lines, low threat profile">
        </label>
        <label class="wide">
          <span>What you dislike</span>
          <input id="dislikesInput" type="text" placeholder="Linear wins, too much shuffling, table hate">
        </label>
        <label class="wide">
          <span>Source URL</span>
          <input id="sourceUrlInput" type="url" placeholder="EDHREC, Moxfield, Archidekt, or notes link">
        </label>
        <label class="wide">
          <span>Notes</span>
          <textarea id="profileNotesInput" rows="5" placeholder="Why it works, why it does not, playgroup reactions, upgrade direction"></textarea>
        </label>
      </div>

      <div class="form-actions">
        <button id="saveProfileButton" class="button" type="button">Save profile</button>
        <button id="deleteProfileButton" class="button danger" type="button">Delete</button>
      </div>
    </section>

    <section class="profile-list panel" aria-label="Saved commander decks">
      <div class="panel-head">
        <h2>Deck Profiles</h2>
        <span id="profileCount" class="mini-status">0 decks</span>
      </div>
      <div class="profile-search-row">
        <input id="profileSearchInput" type="search" placeholder="Search decks, tags, likes, dislikes">
        <select id="profileStatusFilter">
          <option value="all">All statuses</option>
          <option value="active">Active</option>
          <option value="testing">Testing</option>
          <option value="retired">Retired</option>
          <option value="dismantled">Dismantled</option>
        </select>
      </div>
      <div id="profileList" class="profile-card-list"></div>
    </section>

    <section class="profile-insights panel" aria-label="Profile insight explorer">
      <div class="panel-head">
        <h2>Habit Explorer</h2>
        <button id="copyInsightsButton" class="button small" type="button">Copy summary</button>
      </div>
      <div id="habitMetrics" class="compact-metrics"></div>
      <div class="insight-grid">
        <div>
          <h3>Liked Signals</h3>
          <div id="likedSignals" class="tag-cloud"></div>
        </div>
        <div>
          <h3>Disliked Signals</h3>
          <div id="dislikedSignals" class="tag-cloud"></div>
        </div>
        <div>
          <h3>Patterns</h3>
          <div id="patternSignals" class="tag-cloud"></div>
        </div>
        <div>
          <h3>Search Angles</h3>
          <div id="searchAngles" class="stack-list"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
